version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
      - node_modules/**/*
  customHeaders:
    - pattern: '**/*'
      headers:
        - key: 'Strict-Transport-Security'
          value: 'max-age=31536000; includeSubDomains'
        - key: 'X-Frame-Options'
          value: 'SAMEORIGIN'
        - key: 'X-Content-Type-Options'
          value: 'nosniff'
        - key: 'X-XSS-Protection'
          value: '1; mode=block'

# Note: AWS Amplify with Next.js SSR requires:
# 1. Enable SSR in Amplify Console: App Settings > Build Settings > Enable SSR
# 2. Set Platform to "Next.js - SSR" when creating the app
# 3. Configure environment variables in Amplify Console:
#    - DB_HOST
#    - DB_PORT
#    - DB_USER
#    - DB_PASSWORD
#    - DB_NAME
#    - JWT_SECRET
#    - NEXTAUTH_URL (set to your Amplify domain)
#    - NEXT_PUBLIC_API_URL (set to https://your-domain.amplifyapp.com/api)
#    - NEXTAUTH_SECRET
#    - NODE_ENV=production
